[package]
name = "trellis"
version = "0.2.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-multipart = "0.7.2"
confik = "0.15.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
dotenvy = "0.15.7"
actix-cors = "0.7.1"
serde_json = "1.0.140"
chrono = {version ="0.4.41", features = ["serde"]}
argon2 = "0.5.3"
serde = { version = "1.0.219", features = ["derive"] }
actix-ws = "0.4.0"
actix-files = "0.6.6"
env_logger = "0.11.8"
log = "0.4.27"
regex = "1.11.1"
reqwest = { version = "0.13.2", features = ["json"] }
futures-util = "0.3.31"
tokio = { version = "1.43", features = ["full"] }
actix-limitation = "0.5.1"
handlebars = "6.3.2"
notify = "8.2.0"
rushdown-meta = "0.9.9"
